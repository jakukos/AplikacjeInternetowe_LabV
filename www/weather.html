<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Pogodynka</title>
    <meta charset="utf-8">
    <meta name='viewport' content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <script src="./js/pogoda.js"></script>
</head>
<body>
<header>
    <div class="input-container">
        <input type="text" id="city" name="city" placeholder="Wpisz miasto">
        <button id="getWeather">
            <img src="./img/search.png" alt="Search">
        </button>
    </div>
    <div id="weather">
        <div id="cityName"></div>
        <div id="temperature"></div>
        <div id="humidity"></div>
        <div id="pressure"></div>
        <div id="wind"></div>
        <div id="icon"></div>
    </div>
</header>
<div class="container">
    <div class="pogoda">
        <div id="forecast"></div>
    </div>
</div>
</body>
</html>
